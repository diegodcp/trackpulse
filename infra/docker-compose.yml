services:
  postgres:
    image: postgres:16-alpine
    container_name: trackpulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackpulse}
      POSTGRES_USER: ${POSTGRES_USER:-trackpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trackpulse-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.9
    container_name: trackpulse-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda:8082
    ports:
      - "${REDPANDA_BROKER_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
